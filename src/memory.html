<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <title>Memory Game</title>
  </head>
  <body>
    <div class="game-layout">
      <div id="board"></div>
      <div class="game-UI">
        <h2>Players</h2>
        <ul id="player-list">
          <li class="player" data-player-index="0">
            <span class="player-name">Player A</span>
            <span class="player-score">0</span>
          </li>
          <li class="player" data-player-index="1">
            <span class="player-name">Player B</span>
            <span class="player-score">0</span>
          </li>
        </ul>
        <h2>Rules</h2>
        <p>Match all the pairs to win.</p>
      </div>
    </div>
    <div id="pair-banner" class="pair-banner">
      <h1 id="pair-banner-text"></h1>
    </div>
    <div id="inspect">
      <img alt="card image" id="inspect-img" />
      <div class="inspect-info">
        <h2 id="inspect-name"></h2>
        <p id="inspect-text"></p>
        <button id="inspect-close">Close</button>
      </div>
    </div>
    <div class="fogwrapper">
      <div id="foglayer_01" class="fog">
        <div class="image01"></div>
        <div class="image02"></div>
      </div>
      <div id="foglayer_02" class="fog">
        <div class="image01"></div>
        <div class="image02"></div>
      </div>
      <div id="foglayer_03" class="fog">
        <div class="image01"></div>
        <div class="image02"></div>
      </div>
    </div>
  </body>
  <script src="js/memory.js" type="module"></script>
  <script src="js/menu.js" type="module"></script>
</html>
